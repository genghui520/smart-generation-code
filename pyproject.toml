[project]
name = "smart-traffic-agent"
version = "0.1.0"
description = "Multi-agent workflow for CNC protocol traffic generation."
requires-python = ">=3.10"
dependencies = [
  "chromadb>=1.5",
  "langchain>=0.3",
  "langchain-openai>=0.3",
  "requests>=2.31",
  "numpy>=1.26",
  "langgraph>=0.2",
  "sentence-transformers>=5.0",
  "neo4j>=5.0",
  "pyLSV2 @ git+https://github.com/drunsinn/pyLSV2.git@97a3d69184f63e6190d981f587bd0fc98acf200a",
]

[project.optional-dependencies]
ezsocket = [
  "pywin32>=312; sys_platform == 'win32'",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["smart_traffic_agent*"]
